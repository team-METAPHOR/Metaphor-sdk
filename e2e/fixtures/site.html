<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Harness Shop</title>
    <script
      src="/sdk/metaphor.js"
      data-metaphor-project-key="mpk_test"
      data-metaphor-api-base="http://api.test"
      defer
    ></script>
  </head>
  <body>
    <h1>Harness Shop</h1>
    <!-- Fixtures for SDK features: masked fields, a disabled button (rage/dead click), errors. -->
    <form id="login">
      <input name="email" type="email" placeholder="email" />
      <input name="password" type="password" placeholder="password" />
      <button type="submit">로그인</button>
    </form>
    <p data-private>홍길동 · 010-1234-5678</p>
    <textarea id="private-notes">private notes</textarea>
    <select id="private-selection"><option>private selection</option></select>
    <div contenteditable="true" id="private-editable">private editable</div>
    <button id="sold-out" type="button" disabled>품절</button>
    <button data-testid="add-cart" type="button" onclick="fetch('/api/cart?token=never-send', { method: 'POST', body: 'private request body' })">장바구니 담기</button>
    <label>배송 메모 <input id="memo" type="text" /></label>
    <button id="throw" type="button" onclick="setTimeout(() => { throw new Error('harness error') })">오류 발생</button>
  </body>
</html>
