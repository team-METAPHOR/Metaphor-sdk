name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/metaphor.js release/metaphor.js
          echo "sha384-$(openssl dgst -sha384 -binary release/metaphor.js | openssl base64 -A)" > release/metaphor.js.sha384
          echo "${VERSION}" > release/VERSION
          cat release/metaphor.js.sha384
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/metaphor.js release/metaphor.js.sha384 release/VERSION \
            --title "${GITHUB_REF_NAME}" \
            --notes "Metaphor Web SDK ${GITHUB_REF_NAME}. 변경 사항은 CHANGELOG.md를 참고하세요."
